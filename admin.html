<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>পাহাড়ি সওদা, অর্ডার প্যানেল</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#FBF8F3;--s:#fff;--fg:#1E2430;--mut:#646B78;--ac:#E8780F;--act:#B85A00;--ln:#EAE2D5;--ok:#2D6618;--bad:#B3261E}
@media (prefers-color-scheme:dark){:root{--bg:#15130F;--s:#1F1C17;--fg:#F2ECE2;--mut:#A8A092;--ac:#F08A24;--act:#F5A552;--ln:#34302A;--ok:#B2E19A;--bad:#FF9C93}}
*{box-sizing:border-box}body{margin:0;font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;padding:0 max(14px,env(safe-area-inset-left))}
.w{max-width:900px;margin:auto;padding:18px 0 60px}
h1{font-size:22px;margin:0 0 4px}button,a.b{font:inherit;cursor:pointer;border-radius:10px;border:1.5px solid var(--ac);background:none;color:var(--act);padding:8px 14px;min-height:40px;text-decoration:none;display:inline-flex;align-items:center}
button.p{background:var(--ac);color:#fff}button:disabled{opacity:.5}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.bar button[aria-pressed=true]{background:var(--ac);color:#fff}
.card{background:var(--s);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.st{font-weight:600}.mut{color:var(--mut);font-size:14px}
ul{margin:8px 0;padding-left:20px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{background:#DDF0CE;color:#2D6618;border-radius:6px;padding:1px 8px;font-size:13px;margin-right:6px;display:inline-block}
.pay{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}
.msg{margin:8px 0;min-height:1.4em}.sel{user-select:all}
</style>
</head>
<body>
<div class="w">
  <h1>অর্ডার প্যানেল</h1><div class="mut">শুধু দোকানের মালিকের জন্য</div>
  <div id="main"><p>লোড হচ্ছে…</p></div>
</div>
<script>
/* Same Firebase settings as index.html */
window.PS_FIREBASE={apiKey:"AIzaSyCbHBqS-ukybfjf1JQMnCGuf0JJKaUL0dA",authDomain:"pahari-shaoda.firebaseapp.com",projectId:"pahari-shaoda",appId:"1:1035242067046:web:5fcde4039bb6d5b7b6c9a7"};
</script>
<script type="module">
const $=i=>document.getElementById(i),main=$('main'),cfg=window.PS_FIREBASE;
const bn=n=>Number(n).toLocaleString('bn-BD',{maximumFractionDigits:1}),tk=n=>'৳'+bn(Math.round(n));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const VIA={bkash:'বিকাশ',nagad:'নগদ',bank:'ব্যাংক'};
const ST={new:'নতুন',confirmed:'নিশ্চিত',shipped:'পাঠানো হয়েছে',delivered:'ডেলিভারি হয়েছে',cancelled:'বাতিল'};
if(!cfg.apiKey){main.innerHTML='<p>Firebase সেটিং বসানো হয়নি। SETUP.md দেখুন।</p>'}
else{
const base='https://www.gstatic.com/firebasejs/10.12.2/';
const [{initializeApp},A,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
const app=initializeApp(cfg),auth=A.getAuth(app),db=F.getFirestore(app);
let unsub=null,filter='active',orders=[];
A.onAuthStateChanged(auth,u=>{unsub&&unsub();unsub=null;u?start(u):login()});
function login(){main.innerHTML='<div class="card"><p>মালিকের Google অ্যাকাউন্ট দিয়ে ঢুকুন।</p><button class="p" id="g">Google দিয়ে ঢুকুন</button><p class="msg" id="m"></p></div>';
  $('g').onclick=()=>A.signInWithPopup(auth,new A.GoogleAuthProvider()).catch(e=>$('m').textContent='ঢোকা যায়নি: '+e.code)}
async function start(u){
  const a=await F.getDoc(F.doc(db,'admins',u.uid)).catch(()=>null);
  if(!a||!a.exists()){main.innerHTML='<div class="card"><p>এই অ্যাকাউন্টে অনুমতি নেই।</p><p class="mut">Firestore-এ <b>admins</b> কালেকশনে এই আইডি দিয়ে একটি ডকুমেন্ট বানান (SETUP.md ধাপ ৬):</p><p class="sel"><b>'+esc(u.uid)+'</b></p><button id="o">বের হোন</button></div>';$('o').onclick=()=>A.signOut(auth);return}
  main.innerHTML='<div class="top"><span class="mut">'+esc(u.email||u.uid)+'</span><button id="o">বের হোন</button></div><div class="bar" id="fb"></div><p class="msg" id="m" role="status"></p><div id="list"></div>';
  $('o').onclick=()=>A.signOut(auth);
  $('fb').innerHTML=[['active','চলমান'],['new','নতুন'],['delivered','ডেলিভারি হয়েছে'],['cancelled','বাতিল'],['all','সব']].map(([k,t])=>`<button data-f="${k}" aria-pressed="${k===filter}">${t}</button>`).join('');
  $('fb').onclick=e=>{const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;[...$('fb').children].forEach(x=>x.setAttribute('aria-pressed',x===b));draw()}};
  unsub=F.onSnapshot(F.query(F.collection(db,'orders'),F.orderBy('createdAt','desc'),F.limit(150)),s=>{orders=s.docs.map(d=>({id:d.id,...d.data()}));const n=orders.filter(o=>o.status==='new').length;document.title=(n?'('+n+') ':'')+'অর্ডার প্যানেল';draw()},e=>$('m').textContent='অর্ডার লোড হয়নি: '+e.code);
}
function draw(){
  const f=o=>filter==='all'||(filter==='active'?['new','confirmed','shipped'].includes(o.status):o.status===filter);
  const l=orders.filter(f);
  $('list').innerHTML=l.length?l.map(o=>{
    const at=o.createdAt?.toDate?o.createdAt.toDate().toLocaleString('bn-BD'):'';
    const tags=(o.firstFree?'<span class="tag">প্রথম ডেলিভারি ফ্রি</span>':'')+(o.coinsForDelivery?'<span class="tag">১০০ কয়েনে ফ্রি ডেলিভারি</span>':'')+(o.coinsDiscount?`<span class="tag">কয়েন ছাড় ${bn(o.coinsDiscount)} (−${tk(o.coinsDiscount*2)})</span>`:'')+(o.uid?'<span class="tag" style="background:#E3ECFA;color:#1F4E8C">অ্যাকাউন্ট</span>':'');
    const adv=o.advance||0,via=VIA[o.payVia]||'';
    const payHtml=o.payMethod?`<div class="pay"><b>পেমেন্ট:</b> ${o.payMethod==='online'?'পুরো টাকা অনলাইনে':o.payMethod==='cod'?'ডেলিভারি চার্জ অগ্রিম, বাকি ক্যাশ অন ডেলিভারি':esc(o.payMethod)}${adv?`<br>অগ্রিম ${tk(adv)} · ${esc(via)} · আইডি <b class="sel">${esc(o.trxId)}</b>`:'<br>অগ্রিম নেই'+(o.payMethod==='cod'?' (ফ্রি ডেলিভারি)':'')}${o.payMethod==='cod'?`<br>ডেলিভারির সময় নেবেন: <b>${tk(o.total-adv)}</b>`:''}</div>`:'';
    const wa='https://wa.me/88'+esc(o.phone)+'?text='+encodeURIComponent('আসসালামু আলাইকুম, পাহাড়ি সওদা থেকে আপনার অর্ডার (নং '+o.id.slice(-6).toUpperCase()+') নিশ্চিত করতে যোগাযোগ করছি।');
    return `<div class="card"><div class="top"><b>#${o.id.slice(-6).toUpperCase()} · ${esc(o.name)}</b><span class="st">${ST[o.status]||esc(o.status)}</span></div>
    <div class="mut">${at}</div><div>${tags}</div>
    <ul>${(o.items||[]).map(i=>`<li>${esc(i.name)}${i.grams?' ('+(i.grams<1000?bn(i.grams)+' গ্রাম':bn(i.grams/1000)+' কেজি')+')':''} × ${bn(i.qty)} = ${tk(i.price*i.qty)}</li>`).join('')}</ul>
    <div>পণ্য ${tk(o.subtotal)} · ডেলিভারি ${(o.firstFree||o.coinsForDelivery)?'ফ্রি (সাধারণ '+tk(o.deliveryFee)+')':tk(o.deliveryFee)} · ওজন ${bn(o.kg)} কেজি<br><b>সর্বমোট ${tk(o.total)}</b></div>
    ${payHtml}
    <div class="mut">${esc(o.phone)} · ${esc(o.addr)}${o.note?'<br>নোট: '+esc(o.note):''}</div>
    <div class="acts"><a class="b" href="${wa}" target="_blank" rel="noopener">হোয়াটসঅ্যাপ</a>
    ${o.status==='new'?`<button data-s="confirmed" data-id="${o.id}">নিশ্চিত করুন</button>`:''}
    ${['new','confirmed'].includes(o.status)?`<button data-s="shipped" data-id="${o.id}">পাঠানো হয়েছে</button>`:''}
    ${['new','confirmed','shipped'].includes(o.status)?`<button class="p" data-s="delivered" data-id="${o.id}">ডেলিভারি হয়েছে</button><button data-s="cancelled" data-id="${o.id}">বাতিল</button>`:''}</div></div>`}).join(''):'<p class="mut">কোনো অর্ডার নেই।</p>';
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-s]');if(!b)return;
  const id=b.dataset.id,s=b.dataset.s;
  const od=orders.find(x=>x.id===id);
  if(s==='confirmed'&&od&&od.advance>0&&!confirm('অগ্রিম '+tk(od.advance)+' ('+(VIA[od.payVia]||'')+', আইডি '+od.trxId+') আপনার অ্যাপে এসেছে কি মিলিয়ে দেখেছেন? নিশ্চিত করবেন?'))return;
  if(s==='delivered'&&!confirm('ডেলিভারি হয়েছে চিহ্নিত করলে কয়েন হিসাব হবে এবং আর বদলানো যাবে না। নিশ্চিত?'))return;
  if(s==='cancelled'&&!confirm('অর্ডার বাতিল করবেন?'))return;
  b.disabled=true;$('m').textContent='';
  try{
    const note=await setStatus(id,s);
    $('m').style.color='var(--ok)';$('m').textContent='হয়েছে।'+(note?' '+note:'');
  }catch(err){$('m').style.color='var(--bad)';$('m').textContent='হয়নি: '+(err.message||err.code)}
  b.disabled=false;
});
async function setStatus(id,status){
  const oref=F.doc(db,'orders',id);
  if(status!=='delivered'){await F.updateDoc(oref,{status});return ''}
  return F.runTransaction(db,async tx=>{
    const os=await tx.get(oref),o=os.data();
    if(o.status==='delivered')throw new Error('আগেই ডেলিভারি চিহ্নিত হয়েছে');
    if(o.status==='cancelled')throw new Error('বাতিল অর্ডার ডেলিভারি করা যায় না');
    const notes=[];
    if(o.uid){
      const uref=F.doc(db,'users',o.uid),us=await tx.get(uref),u=us.exists()?us.data():null;
      let rref=null,rs=null;
      if(u&&u.referredByUid&&!u.referralPaid){rref=F.doc(db,'users',u.referredByUid);rs=await tx.get(rref)}
      if(u){
        const spend=(o.coinsDiscount||0)+(o.coinsForDelivery||0),coins=u.coins||0;
        if(spend>coins)throw new Error('কাস্টমারের কয়েন কম আছে ('+coins+', লাগবে '+spend+'), এই অর্ডারে ছাড় দেবেন না, কাস্টমারকে জানান');
        const upd={coins:coins-spend};
        if(o.firstFree){if(u.firstFreeUsed)notes.push('সতর্কতা: প্রথম ডেলিভারি ফ্রি আগেই ব্যবহার হয়েছে, ডেলিভারি চার্জ আলাদা নিন।');upd.firstFreeUsed=true}
        if(rref&&rs&&rs.exists()){upd.coins+=20;upd.referralPaid=true;tx.update(rref,{coins:(rs.data().coins||0)+20});notes.push('রেফারাল বোনাস: দুজনকে ২০ কয়েন করে যোগ হয়েছে।')}
        tx.update(uref,upd);
      }
    }
    tx.update(oref,{status:'delivered',deliveredAt:F.serverTimestamp()});
    return notes.join(' ');
  });
}
}
</script>
</body>
</html>
